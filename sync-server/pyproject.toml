[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunex-sync-server"
version = "1.0.0"
description = "Opportunex — self-hostable, end-to-end encrypted sync server"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Momo Godi Yvan" }]
maintainers = [{ name = "ETS Monthe Network" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["opx_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "BLE"]
ignore = ["S101", "B008", "N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests/"]
