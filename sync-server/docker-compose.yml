# Opportunex sync server: API + PostgreSQL 16 + Caddy (automatic HTTPS).
#   cp .env.example .env   # then edit the values
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opportunex_sync
      POSTGRES_USER: opportunex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunex -d opportunex_sync"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: opportunex-sync:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      OPX_SYNC_DATABASE_URL: postgresql+psycopg://opportunex:${POSTGRES_PASSWORD}@db:5432/opportunex_sync
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPX_SYNC_DOMAIN: ${OPX_SYNC_DOMAIN:?set OPX_SYNC_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Daily PostgreSQL dump kept 7 days (arch §10.3). Restore: see README.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
               pg_dump -h db -U opportunex -d opportunex_sync -Fc -f /backups/sync-$$(date +%F).dump &&
               find /backups -name "sync-*.dump" -mtime +7 -delete;
               sleep 86400;
             done'

volumes:
  db-data:
  caddy-data:
  caddy-config:
