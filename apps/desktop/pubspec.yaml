name: opportunex
description: "Opportunex — Découvrez. Comprenez. Candidatez. Desktop client of the local opportunity-intelligence engine."
publish_to: none

# Keep in sync with engine/core/version.py (checked by packaging scripts).
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State and navigation (ADR-013)
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0

  # Local engine API (HTTP + WebSocket over 127.0.0.1)
  dio: ^5.7.0

  # Non-secret UI preferences readable before sign-in (language, theme, last profile)
  shared_preferences: ^2.3.0

  # Desktop integration
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  local_notifier: ^0.1.6
  url_launcher: ^6.3.1
  file_picker: ^8.1.7

  # Formatting, charts, utilities
  intl: any
  fl_chart: ^1.2.0
  path: ^1.9.1
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/legal/
    - assets/fonts/Inter-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
