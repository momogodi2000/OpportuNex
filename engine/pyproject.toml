[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "opportunex-engine"
version = "0.1.0"
description = "OpportuNex — Intelligence des Opportunités — Local Engine"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.12"
authors = [{ name = "ING Momo Godi Yvan", email = "contact@protegeqv.org" }]

dependencies = [
    # API & async
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    # Encryption (SQLCipher binding handled separately via sqlcipher3)
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "PyNaCl>=1.5.0",
    "keyring>=25.5.0",
    # HTTP & collection
    "httpx[http2]>=0.27.0",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "trafilatura>=1.12.0",
    "feedparser>=6.0.11",
    "extruct>=0.17.0",
    "Protego>=0.3.1",
    # Document parsing
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    # Data normalization
    "dateparser>=1.2.0",
    "langdetect>=1.0.9",
    "url-normalize>=2.1.0",
    "rapidfuzz>=3.10.0",
    # Scheduling
    "APScheduler>=3.10.4",
    # Exports
    "openpyxl>=3.1.5",
    "weasyprint>=62.3",
    # Logging
    "structlog>=24.4.0",
    # AI clients (OpenAI-compat HTTP, no SDK lock-in)
    "httpx-sse>=0.4.0",
    # Password list
    "zxcvbn>=4.4.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "hypothesis>=6.115.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
]
headless = [
    "playwright>=1.48.0",
]
embeddings = [
    "fastembed>=0.3.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "S", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=html --cov-exclude=tests/*"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "migrations/*", "main.py"]
