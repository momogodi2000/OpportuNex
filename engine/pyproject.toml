[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunex-engine"
version = "1.0.0"
description = "Opportunex — local opportunity-intelligence engine (FastAPI + SQLCipher)"
readme = "../README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Momo Godi Yvan" }]
maintainers = [{ name = "ETS Monthe Network" }]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
include = [
    "api*", "core*", "persistence*", "security*", "services*", "collection*", "domain*",
    "search*", "documents*", "matching*", "ai*",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["_legacy", "dist-venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "BLE"]
ignore = [
    "S101",   # assert is fine in tests
    "S608",   # SQL is built with SQLAlchemy Core; flagged f-strings are DDL constants
    "RUF001", # French text legitimately contains typographic characters
    "RUF002",
    "RUF003",
    "B008",   # FastAPI Depends() in defaults
    "N806",   # `T = db.tables` is the house alias for the reflected schema
    "N803",   # ...also when passed as a parameter
    "N818",   # HTTP-semantic error names (NotFound, Conflict...) read better than *Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "BLE001", "E501", "UP031", "S104"]
"persistence/migrations/**" = ["S608", "E501"]
"search/interpreter.py" = ["E501"]
"documents/generator.py" = ["E501"]
"collection/normalize.py" = ["E501"]
"tools/**" = ["E402", "T201"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["_legacy/", "dist-venv/", "tests/"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_legacy", ".venv", "dist-venv", "build", "dist"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.coverage.run]
source = [
    "api", "core", "persistence", "security", "services", "collection",
    "search", "documents", "matching", "ai",
]
omit = ["persistence/migrations/*", "_legacy/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
