# Builds the distributable packages when a version tag (v1.2.3) is pushed, or on demand.
# The artifacts are unsigned until code signing is set up (decision D-12); SHA-256 sums are attached.
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
      - name: Engine environment
        run: |
          python -m venv engine/.venv
          engine/.venv/Scripts/python -m pip install -r engine/requirements.txt -r engine/requirements-dev.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build (engine, desktop, portable ZIP, installer)
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: opportunex-windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
            dist/windows/SHA256SUMS.txt

  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Builder image
        run: docker build -t opportunex-linux-builder packaging/linux
      - name: Build the .deb
        run: docker run --rm -v "$PWD:/src" opportunex-linux-builder bash packaging/linux/build-deb.sh
      - name: Install and test in a clean Ubuntu 24.04
        run: docker run --rm -v "$PWD:/src" ubuntu:24.04 bash /src/packaging/linux/test-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opportunex-debian
          path: dist/linux/
